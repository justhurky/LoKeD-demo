<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HÖK AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f10;
      --panel: #1a1a1f;
      --panel-2: #202028;
      --line: #2c2c36;
      --text: #e2e2e8;
      --muted: #8b8b9a;
      --accent: #7c6af7;
      --accent-2: #36d399;
      --danger: #ff6b7a;
      --warn: #f6c96b;
      --radius: 8px;
      --shadow: 0 18px 50px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 1180px;
      min-height: 760px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }

    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: 240px minmax(620px, 1fr) 320px;
      height: 100vh;
      width: 100vw;
    }

    .sidebar {
      background: #111114;
      border-right: 1px solid var(--line);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px 12px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #42d6c4);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: white;
    }

    .brand h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 750;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 1px;
    }

    .primary-action {
      height: 38px;
      border-radius: var(--radius);
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 650;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav button {
      height: 38px;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      text-align: left;
    }

    .nav button.active,
    .nav button:hover {
      background: var(--panel);
      color: var(--text);
    }

    .nav .glyph {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: var(--muted);
      background: #17171c;
      font-size: 11px;
      font-weight: 800;
    }

    .sidebar-footer {
      margin-top: auto;
      border-top: 1px solid var(--line);
      padding-top: 12px;
      display: grid;
      gap: 8px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      display: inline-block;
      margin-right: 6px;
    }

    .dot.ok { background: var(--accent-2); }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% -20%, rgba(124, 106, 247, .10), transparent 34%), var(--bg);
    }

    .topbar {
      height: 58px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .content {
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }

    .view {
      height: 100%;
      display: none;
      padding: 18px 24px;
      overflow: auto;
    }

    .view.active { display: block; }

    .chat-view {
      height: 100%;
      display: none;
      grid-template-rows: 1fr auto;
      padding: 0;
      overflow: hidden;
    }

    .chat-view.active { display: grid; }

    .messages {
      overflow: auto;
      padding: 28px 28px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      width: 100%;
    }

    .message.user { justify-content: flex-end; }

    .bubble {
      max-width: min(760px, 78%);
      border-radius: var(--radius);
      padding: 13px 15px;
      background: var(--panel);
      border: 1px solid var(--line);
      white-space: pre-wrap;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .14);
    }

    .message.user .bubble {
      background: var(--accent);
      border-color: transparent;
      color: white;
    }

    .bubble .model {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
    }

    details.sources {
      max-width: min(760px, 78%);
      margin-top: -10px;
      margin-left: 0;
      color: var(--muted);
    }

    details.sources summary {
      cursor: pointer;
      padding: 8px 0;
      font-size: 12px;
    }

    .source {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: rgba(26, 26, 31, .82);
      margin-bottom: 8px;
    }

    .source strong {
      display: block;
      color: var(--text);
      font-size: 12px;
      margin-bottom: 3px;
    }

    .source code {
      display: block;
      color: var(--muted);
      font-size: 11px;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .composer {
      padding: 14px 22px 20px;
      border-top: 1px solid var(--line);
      background: rgba(15, 15, 16, .92);
    }

    .composer-inner {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: end;
      gap: 10px;
      max-width: 960px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
    }

    textarea, input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #121216;
      color: var(--text);
      padding: 10px 11px;
      outline: none;
    }

    textarea:focus, input:focus, select:focus {
      border-color: rgba(124, 106, 247, .78);
      box-shadow: 0 0 0 3px rgba(124, 106, 247, .12);
    }

    textarea {
      resize: vertical;
      min-height: 72px;
    }

    .composer textarea {
      min-height: 48px;
      max-height: 150px;
      border: 0;
      background: transparent;
      padding: 6px;
      box-shadow: none;
    }

    .attached-file {
      max-width: 960px;
      margin: 0 auto 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(26, 26, 31, .78);
      padding: 8px 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .attached-file strong {
      color: var(--text);
      font-weight: 600;
    }

    .btn {
      height: 36px;
      padding: 0 12px;
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }

    .btn:hover { border-color: #3d3d4a; }
    .btn.accent { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.danger { background: transparent; border-color: rgba(255, 107, 122, .45); color: var(--danger); }

    .right-panel {
      background: #111114;
      border-left: 1px solid var(--line);
      padding: 16px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .panel-title h3 {
      margin: 0;
      font-size: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 13px;
    }

    .panel h3,
    .panel h4 {
      margin: 0 0 10px;
      font-size: 13px;
    }

    .muted { color: var(--muted); }
    .small { font-size: 12px; }

    .grid {
      display: grid;
      gap: 12px;
    }

    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
    }

    .kanban {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      min-height: 560px;
    }

    .column {
      background: rgba(26, 26, 31, .55);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      min-width: 0;
    }

    .column h3 {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .card-list {
      display: grid;
      gap: 9px;
    }

    .task-card,
    .doc-row,
    .person-row,
    .result-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
    }

    .task-card.overdue { border-color: rgba(255, 107, 122, .7); }

    .task-card h4,
    .person-row h4,
    .doc-row h4 {
      margin: 0 0 7px;
      font-size: 13px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      min-height: 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #15151a;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(360px, .8fr);
      gap: 14px;
      align-items: start;
    }

    .dropzone {
      border: 1px dashed #3c3c49;
      border-radius: var(--radius);
      padding: 18px;
      background: rgba(26, 26, 31, .45);
      text-align: center;
    }

    .dropzone.drag { border-color: var(--accent); background: rgba(124, 106, 247, .12); }

    .banner {
      display: none;
      border: 1px solid rgba(246, 201, 107, .38);
      background: rgba(246, 201, 107, .10);
      color: #f8df9a;
      padding: 10px 12px;
      border-radius: var(--radius);
      margin: 14px 24px 0;
    }

    .banner.visible { display: block; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .62);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.visible { display: flex; }

    .modal {
      width: min(720px, calc(100vw - 48px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .modal h3 {
      margin: 0 0 14px;
      font-size: 15px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">H</div>
        <div>
          <h1>HÖK AI</h1>
          <span>lokális asszisztens</span>
        </div>
      </div>
      <button class="primary-action" id="newChatBtn">+ Új beszélgetés</button>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <div class="status-row"><span><i class="dot" id="ollamaDot"></i>Ollama</span><span id="ollamaText">ellenőrzés</span></div>
        <div class="status-row"><span>Modell</span><span id="modelText">qwen3:14b</span></div>
        <div class="status-row"><span>Tudás</span><span id="knowledgeText">0 dokumentum</span></div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h2 id="viewTitle">Chat</h2>
        <div class="toolbar" id="viewToolbar"></div>
      </div>
      <div class="banner" id="ollamaBanner">Ollama nem fut — indítsd el: <code>ollama serve</code></div>
      <section class="content">
        <div id="view-chat" class="chat-view active">
          <div class="messages" id="messages"></div>
          <div class="composer">
            <input class="hidden" type="file" id="chatFileInput" accept=".txt,.md,.csv,.docx,.docm,.pdf,.xlsx,.xlsm">
            <div class="attached-file hidden" id="attachedFile"></div>
            <div class="composer-inner">
              <textarea id="chatInput" spellcheck="true" placeholder="Kérdezz az indexelt HÖK/EHÖK anyagokról"></textarea>
              <button class="btn" id="attachFileBtn">Fájl</button>
              <button class="btn" id="thinkBtn">/think</button>
              <button class="btn accent" id="sendBtn">Küldés</button>
            </div>
          </div>
        </div>
        <div id="view-feladatok" class="view"></div>
        <div id="view-meeting" class="view"></div>
        <div id="view-dokumentumok" class="view"></div>
        <div id="view-emberek" class="view"></div>
        <div id="view-attekinto" class="view"></div>
        <div id="view-beallitasok" class="view"></div>
      </section>
    </main>

    <aside class="right-panel" id="rightPanel">
      <div class="panel-title">
        <h3>Kontextus</h3>
        <button class="btn" id="refreshContextBtn">Frissítés</button>
      </div>
      <div class="panel">
        <h4>Ma figyelendő</h4>
        <div id="contextTasks" class="stack small muted"></div>
      </div>
      <div class="panel">
        <h4>Utóbbi döntések</h4>
        <div id="contextDecisions" class="stack small muted"></div>
      </div>
    </aside>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <script>
    const views = [
      ["chat", "Chat", "AI"],
      ["feladatok", "Feladatok", "FK"],
      ["meeting", "Meeting elemző", "ME"],
      ["dokumentumok", "Dokumentumok", "DK"],
      ["emberek", "Emberek", "EM"],
      ["attekinto", "Áttekintő", "AT"],
      ["beallitasok", "Beállítások", "BE"]
    ];

    const state = {
      active: "chat",
      health: null,
      tasks: [],
      people: [],
      documents: [],
      dashboard: null,
      meetingAnalysis: null,
      chatFile: null,
      think: false
    };

    const $ = (selector) => document.querySelector(selector);
    const api = async (url, options = {}) => {
      const response = await fetch(url, {
        ...options,
        headers: {"Content-Type": "application/json", ...(options.headers || {})}
      });
      if (!response.ok) {
        const text = await response.text();
        let message = text;
        try { message = JSON.parse(text).detail || text; } catch {}
        throw new Error(message);
      }
      return response.json();
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function initNav() {
      $("#nav").innerHTML = views.map(([id, label, glyph]) => `
        <button data-view="${id}" class="${id === state.active ? "active" : ""}">
          <span class="glyph">${glyph}</span><span>${label}</span>
        </button>
      `).join("");
      $("#nav").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-view]");
        if (!button) return;
        setView(button.dataset.view);
      });
    }

    async function setView(id) {
      state.active = id;
      for (const [viewId, label] of views) {
        const el = $(`#view-${viewId}`);
        el.classList.toggle("active", viewId === id);
        if (viewId === id) $("#viewTitle").textContent = label;
      }
      document.querySelectorAll("#nav button").forEach((button) => {
        button.classList.toggle("active", button.dataset.view === id);
      });
      await renderActiveView();
    }

    async function refreshHealth() {
      try {
        state.health = await api("/api/health");
        const adapter = state.health.peft_adapter || {};
        $("#ollamaDot").classList.toggle("ok", !!state.health.ollama);
        $("#ollamaText").textContent = state.health.ollama ? "online" : "offline";
        $("#modelText").textContent = `${state.health.chat_model || "qwen3:14b"}${adapter.online ? " · PEFT" : ""}`;
        $("#knowledgeText").textContent = `${state.health.knowledge.documents} dokumentum`;
        $("#ollamaBanner").classList.toggle("visible", !state.health.ollama);
      } catch {
        $("#ollamaText").textContent = "offline";
        $("#ollamaBanner").classList.add("visible");
      }
    }

    async function refreshContext() {
      try {
        state.dashboard = await api("/api/dashboard");
        $("#contextTasks").innerHTML = (state.dashboard.urgent_tasks || []).slice(0, 5).map(task => `
          <div>${escapeHtml(task.title)}<br><span class="muted">${escapeHtml(task.owner || "nincs felelős")} · ${escapeHtml(task.deadline || "nincs határidő")}</span></div>
        `).join("") || "Nincs kiemelt feladat.";
        $("#contextDecisions").innerHTML = (state.dashboard.decisions || []).slice(0, 5).map(decision => `
          <div>${escapeHtml(decision.text)}<br><span class="muted">${escapeHtml(decision.date || "dátum nélkül")}</span></div>
        `).join("") || "Nincs rögzített döntés.";
      } catch {
        $("#contextTasks").textContent = "Nem sikerült frissíteni.";
      }
    }

    function addMessage(role, text) {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrapper.appendChild(bubble);
      $("#messages").appendChild(wrapper);
      $("#messages").scrollTop = $("#messages").scrollHeight;
      return bubble;
    }

    function renderSources(sources) {
      if (!sources || !sources.length) return "";
      return `
        <details class="sources">
          <summary>Források (${sources.length})</summary>
          ${sources.map(source => `
            <div class="source">
              <strong>${escapeHtml(source.document_name || source.id)} · ${Number(source.score || 0).toFixed(2)}</strong>
              <code>${escapeHtml(source.path || "")}</code>
              <div>${escapeHtml(source.paragraph || "")}</div>
              <div>${escapeHtml((source.snippet || "").slice(0, 360))}</div>
            </div>
          `).join("")}
        </details>
      `;
    }

    function formatAnswer(raw) {
      const text = escapeHtml(raw);
      return text.replace(/&lt;think&gt;([\s\S]*?)&lt;\/think&gt;/g, (_match, inner) => `
        <details class="source" open>
          <summary>Gondolkodási folyamat</summary>
          <em>${inner}</em>
        </details>
      `);
    }

    function formatFileSize(bytes) {
      if (!bytes) return "0 B";
      const units = ["B", "KB", "MB", "GB"];
      let value = bytes;
      let index = 0;
      while (value >= 1024 && index < units.length - 1) {
        value /= 1024;
        index += 1;
      }
      return `${value.toFixed(index === 0 ? 0 : 1)} ${units[index]}`;
    }

    function renderAttachedFile() {
      const box = $("#attachedFile");
      const file = state.chatFile;
      if (!file) {
        box.classList.add("hidden");
        box.innerHTML = "";
        return;
      }
      box.classList.remove("hidden");
      box.innerHTML = `
        <span><strong>${escapeHtml(file.name)}</strong> · ${formatFileSize(file.size)}</span>
        <button class="btn" id="removeChatFileBtn">Eltávolítás</button>
      `;
      $("#removeChatFileBtn").onclick = clearChatFile;
    }

    function clearChatFile() {
      state.chatFile = null;
      $("#chatFileInput").value = "";
      renderAttachedFile();
    }

    async function sendChat() {
      const input = $("#chatInput");
      let message = input.value.trim();
      if (!message && state.chatFile) message = "Foglaldd össze a feltöltött fájlt, és emeld ki a fontos teendőket.";
      if (!message) return;
      if (state.chatFile) return sendChatWithFile(message);
      if (state.think && !message.toLowerCase().startsWith("/think")) message = `/think ${message}`;
      input.value = "";
      addMessage("user", message);
      const bubble = addMessage("assistant", "");
      let buffer = "";
      let sources = [];
      try {
        const response = await fetch("/api/chat/stream", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message})
        });
        if (!response.ok || !response.body) throw new Error(await response.text());
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let pending = "";
        while (true) {
          const {value, done} = await reader.read();
          if (done) break;
          pending += decoder.decode(value, {stream: true});
          const lines = pending.split("\n");
          pending = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const item = JSON.parse(line);
            if (item.type === "meta") sources = item.sources || [];
            if (item.type === "token") {
              buffer += item.text;
              bubble.textContent = buffer;
              $("#messages").scrollTop = $("#messages").scrollHeight;
            }
            if (item.type === "error") bubble.textContent = `Hiba: ${item.error}`;
            if (item.type === "done" && item.model) {
              const model = document.createElement("span");
              model.className = "model";
              model.textContent = `Modell: ${item.model}`;
              bubble.appendChild(model);
            }
          }
        }
        bubble.innerHTML = formatAnswer(buffer);
        const model = document.createElement("span");
        model.className = "model";
        model.textContent = "Forrásalapú válasz";
        bubble.appendChild(model);
        const sourcesNode = document.createElement("div");
        sourcesNode.innerHTML = renderSources(sources);
        $("#messages").appendChild(sourcesNode);
      } catch (error) {
        bubble.textContent = `Hiba: ${error.message}`;
      }
      $("#messages").scrollTop = $("#messages").scrollHeight;
    }

    async function sendChatWithFile(message) {
      const file = state.chatFile;
      if (!file) return;
      $("#chatInput").value = "";
      addMessage("user", `${message}\n\nCsatolt fájl: ${file.name}`);
      const bubble = addMessage("assistant", "Fájl feldolgozása...");
      const form = new FormData();
      form.append("instruction", message);
      form.append("file", file);
      form.append("index", "true");
      try {
        const response = await fetch("/api/chat/file", {method: "POST", body: form});
        if (!response.ok) throw new Error(await response.text());
        const data = await response.json();
        bubble.innerHTML = formatAnswer(data.answer || "");
        const model = document.createElement("span");
        model.className = "model";
        const fileInfo = data.file?.truncated ? " · hosszú fájl: részletekkel dolgozott" : "";
        model.textContent = `Modell: ${data.model || "ismeretlen"} · Fájl: ${data.file?.name || file.name}${fileInfo}`;
        bubble.appendChild(model);
        const sourcesNode = document.createElement("div");
        sourcesNode.innerHTML = renderSources(data.sources || []);
        $("#messages").appendChild(sourcesNode);
        clearChatFile();
        refreshHealth();
      } catch (error) {
        bubble.textContent = `Hiba: ${error.message}`;
      }
      $("#messages").scrollTop = $("#messages").scrollHeight;
    }

          <div class="panel stack">
            <h3>Modellek</h3>
            <div class="field"><label>Ollama host URL</label><input id="ollamaHost" value="${escapeHtml(settings.ollama_host || "http://127.0.0.1:11434")}"></div>
            <div class="field"><label>Chat modell</label><input id="chatModel" list="ollamaModels" value="${escapeHtml(settings.chat_model || "qwen3:14b")}"></div>
            <div class="field"><label>Fallback modell</label><input id="fallbackModel" list="ollamaModels" value="${escapeHtml(settings.fallback_model || "qwen2.5:14b")}"></div>
            <div class="field"><label>Saját 4B modell</label><input id="custom4bModel" list="ollamaModels" value="${escapeHtml(settings.custom_4b_model || "hok-ai-jegyzokonyv-4b")}"></div>
            <div class="field"><label>Jegyzőkönyv modell</label><input id="minutesModel" list="ollamaModels" value="${escapeHtml(settings.minutes_model || settings.custom_4b_model || "hok-ai-jegyzokonyv-4b")}"></div>
            <div class="field"><label>Meeting JSON modell</label><input id="meetingModel" list="ollamaModels" value="${escapeHtml(settings.meeting_model || settings.chat_model || "qwen3:14b")}"></div>
            <div class="field"><label>Fájl feldolgozó modell</label><input id="fileModel" list="ollamaModels" value="${escapeHtml(settings.file_model || "qwen2.5:7b-instruct")}"></div>
            <div class="field"><label>Embedding modell</label><input id="embeddingModel" list="ollamaModels" value="${escapeHtml(settings.embedding_model || "nomic-embed-text")}"></div>
            <datalist id="ollamaModels">${(tags.models || []).map(name => `<option value="${escapeHtml(name)}"></option>`).join("")}</datalist>
            <div class="small muted">PEFT adapter: ${adapter.online ? "online" : "offline"} · path: ${adapter.path_exists ? "OK" : "hianyzik"}</div>
          </div>
          <div class="panel stack">
            <h3>Lokális működés</h3>
            <div class="field"><label>PEFT adapter</label><select id="peftAdapterEnabled"><option value="true" ${settings.peft_adapter_enabled !== "false" ? "selected" : ""}>bekapcsolva</option><option value="false" ${settings.peft_adapter_enabled === "false" ? "selected" : ""}>kikapcsolva</option></select></div>
            <div class="field"><label>PEFT worker URL</label><input id="peftAdapterUrl" value="${escapeHtml(settings.peft_adapter_url || "http://127.0.0.1:7843")}"></div>
            <div class="field"><label>PEFT adapter path</label><input id="peftAdapterPath" value="${escapeHtml(settings.peft_adapter_path || "hok_ai/data/models/hok-ai-domain-4b-peft")}"></div>
            <div class="field"><label>Whisper modell</label><select id="whisperModel">${["tiny", "base", "small"].map(m => `<option ${settings.whisper_model === m ? "selected" : ""}>${m}</option>`).join("")}</select></div>
            <div class="field"><label>Figyelt mappa</label><input id="watchedFolder" value="${escapeHtml(settings.watched_folder || "")}"></div>
            <div class="field"><label>Határidő-értesítők</label><select id="notificationsEnabled"><option value="true" ${settings.notifications_enabled === "true" ? "selected" : ""}>bekapcsolva</option><option value="false" ${settings.notifications_enabled !== "true" ? "selected" : ""}>kikapcsolva</option></select></div>
            <div class="field"><label>Magyar szótár</label><select id="hunspellEnabled"><option value="true" ${settings.hunspell_enabled === "true" ? "selected" : ""}>bekapcsolva</option><option value="false" ${settings.hunspell_enabled !== "true" ? "selected" : ""}>kikapcsolva</option></select></div>
            <div class="field"><label>Adatbázis</label><input disabled value="hok_ai/data/hok_ai.sqlite"></div>
          </div>
        </div>
      `;
      $("#saveSettingsBtn").onclick = async () => {
        await api("/api/settings", {method: "PUT", body: JSON.stringify({
          ollama_host: $("#ollamaHost").value,
          chat_model: $("#chatModel").value,
          fallback_model: $("#fallbackModel").value,
          custom_4b_model: $("#custom4bModel").value,
          minutes_model: $("#minutesModel").value,
          meeting_model: $("#meetingModel").value,
          file_model: $("#fileModel").value,
          embedding_model: $("#embeddingModel").value,
          peft_adapter_enabled: $("#peftAdapterEnabled").value,
          peft_adapter_url: $("#peftAdapterUrl").value,
          peft_adapter_path: $("#peftAdapterPath").value,
          whisper_model: $("#whisperModel").value,
          watched_folder: $("#watchedFolder").value,
          notifications_enabled: $("#notificationsEnabled").value,
          hunspell_enabled: $("#hunspellEnabled").value
        })});
        refreshHealth();
      };
    }

    function showModal() { $("#modalBackdrop").classList.add("visible"); }
    function hideModal() { $("#modalBackdrop").classList.remove("visible"); }

    $("#sendBtn").onclick = sendChat;
    $("#attachFileBtn").onclick = () => $("#chatFileInput").click();
    $("#chatFileInput").onchange = () => {
      state.chatFile = $("#chatFileInput").files[0] || null;
      renderAttachedFile();
    };
    $("#chatInput").addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendChat();
      }
    });
    $("#thinkBtn").onclick = () => {
      state.think = !state.think;
      $("#thinkBtn").classList.toggle("accent", state.think);
    };
    $("#newChatBtn").onclick = () => { $("#messages").innerHTML = ""; setView("chat"); };
    $("#refreshContextBtn").onclick = refreshContext;
    $("#modalBackdrop").addEventListener("click", event => { if (event.target.id === "modalBackdrop") hideModal(); });

    initNav();
    refreshHealth();
    refreshContext();
    setInterval(refreshHealth, 15000);
  </script>
</body>
</html>
